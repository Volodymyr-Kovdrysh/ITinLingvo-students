<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Заглушка для рисунка з Google Drive</title>
  <desc id="desc">Універсальна заглушка для майбутнього рисунка або скріншота з Google Drive чи Google Drawings.</desc>
  <rect width="1200" height="680" fill="#f5f6f7"/>
  <rect x="78" y="72" width="1044" height="500" rx="14" fill="#ffffff" stroke="#98a2b3" stroke-width="4"/>
  <rect x="126" y="126" width="948" height="330" rx="10" fill="#eef2f6" stroke="#c4ccd4" stroke-width="3" stroke-dasharray="18 14"/>
  <path d="M504 292h192M600 196v192" stroke="#667085" stroke-width="18" stroke-linecap="round"/>
  <text x="600" y="506" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" fill="#344054">Місце для рисунка з Google Drive</text>
  <text x="600" y="552" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#667085">Вставити повний Google Drive URL у параметр :url:</text>
  <text x="600" y="628" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#667085">Google Drive / Google Drawings / скріншот</text>
</svg>
